[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microclaw"
version = "0.1.0"
description = "🦞 microclaw — Python rewrite of OpenClaw: personal AI assistant CLI with multi-provider, multi-agent, and skill support"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=0.42.0",
    "openai>=1.60.0",
    "rich>=13.9.0",
    "prompt_toolkit>=3.0.48",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.0",
    "lxml_html_clean>=0.4.0",
    "PyYAML>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "qrcode>=7.4.2",
]

[project.scripts]
microclaw = "microclaw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/microclaw"]

[tool.hatch.build]
sources = ["src"]
